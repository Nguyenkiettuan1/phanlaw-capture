name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Preflight (macOS icon required)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        if [ ! -f "assets/icon.icns" ]; then
          echo "::error::Missing assets/icon.icns. macOS build requires an .icns icon. Please add assets/icon.icns (see MACOS_SETUP.md)."
          exit 1
        fi

    - name: Build Windows (no publish)
      if: matrix.os == 'windows-latest'
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build macOS (no publish)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: npx electron-builder --mac --publish=never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-dist
        path: dist/
        
    - name: Create/Update GitHub Release (attach artifacts)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.exe
          dist/*.dmg
          dist/*.zip
          dist/*.yml
          dist/*.blockmap
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
