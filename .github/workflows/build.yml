name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build browser extension zip
      run: npm run build-extension

    - name: Build Windows (Setup + Portable)
      run: npm run dist
        
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-dist
        path: dist/
        retention-days: 7

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Linux (AppImage)
      run: npm run build-linux

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-dist
        path: dist/
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Install macOS DMG build dependency
      run: npm install dmg-license@1.0.11 --no-save
      
    - name: Generate macOS icon (.icns) from .ico using built-in tools (if missing)
      shell: bash
      run: |
        if [ -f "assets/icon.icns" ]; then
          echo "assets/icon.icns already exists, skipping."
          exit 0
        fi
        if [ ! -f "assets/icon.ico" ]; then
          echo "::error::Missing assets/icon.ico. Cannot generate icon.icns."
          exit 1
        fi

        echo "Generating assets/icon.png from assets/icon.ico (sips)..."
        mkdir -p assets
        sips -s format png assets/icon.ico --out assets/icon.png

        echo "Generating .iconset and converting to .icns (iconutil)..."
        ICONSET_DIR=$(mktemp -d -t icon.iconset).iconset
        mkdir -p "$ICONSET_DIR"

        for size in 16 32 128 256 512; do
          sips -z $size $size assets/icon.png --out "$ICONSET_DIR/icon_${size}x${size}.png"
          sips -z $((size*2)) $((size*2)) assets/icon.png --out "$ICONSET_DIR/icon_${size}x${size}@2x.png"
        done

        iconutil -c icns "$ICONSET_DIR" -o assets/icon.icns
        ls -lh assets/icon.icns assets/icon.png

    - name: Build macOS
      shell: bash
      run: npm run build-mac
        
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-dist
        path: dist/
        retention-days: 7

  package-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-dist
        path: artifacts/windows
        
    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: macos-dist
        path: artifacts/macos
        continue-on-error: true

    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-dist
        path: artifacts/linux
        continue-on-error: true
        
    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag version: $VERSION"
        
    - name: List all artifacts
      shell: bash
      run: |
        echo "=== Windows artifacts ==="
        find artifacts/windows -type f 2>/dev/null | sort || echo "No Windows artifacts found"
        echo ""
        echo "=== macOS artifacts ==="
        find artifacts/macos -type f 2>/dev/null | sort || echo "No macOS artifacts found"
        echo ""
        echo "=== Linux artifacts ==="
        find artifacts/linux -type f 2>/dev/null | sort || echo "No Linux artifacts found"
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build browser extension zip
      run: npm run build-extension

    - name: Prepare release files
      shell: bash
      run: |
        # Flatten directory structure for easier file matching
        mkdir -p release-files
        
        # Copy Windows files
        if [ -d "artifacts/windows" ]; then
          find artifacts/windows -type f \( -name "*.exe" -o -name "*.blockmap" -o -name "latest*.yml" -o -name "extension.zip" \) -exec cp {} release-files/ \;
        fi
        
        # Copy macOS files
        if [ -d "artifacts/macos" ]; then
          find artifacts/macos -type f \( -name "*.dmg" -o -name "latest-mac.yml" \) -exec cp {} release-files/ \;
        fi

        # Copy Linux files
        if [ -d "artifacts/linux" ]; then
          find artifacts/linux -type f \( -name "*.AppImage" -o -name "latest-linux.yml" \) -exec cp {} release-files/ \;
        fi

        # Ensure extension.zip is always included (built in package-release job)
        if [ -f "dist/extension.zip" ]; then
          cp dist/extension.zip release-files/extension.zip
        fi
        
        echo "=== Files ready for release ==="
        ls -lh release-files/ || echo "No files found"

        if [ ! -f "release-files/extension.zip" ]; then
          echo "::error::extension.zip is missing from release package"
          exit 1
        fi

    - name: Upload packaged release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-dist
        path: release-files/
        retention-days: 7
